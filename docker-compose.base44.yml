services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: dashboard
      POSTGRES_DB: dashboard
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashboard"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./backend:/app
      - pipcache:/root/.cache/pip
    environment:
      DATABASE_URL: postgresql://dashboard:dashboard@db:5432/dashboard
      DASHBOARD_TZ: America/Mexico_City
      CORS_ORIGINS: "*"
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    command: sh -c "pip install --no-cache-dir -r requirements.txt && uvicorn server:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:20-slim
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - npmcache:/root/.npm
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DANGEROUSLY_DISABLE_HOST_CHECK: "true"
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      REACT_APP_BACKEND_URL: https://8000-${BASE44_PUBLIC_HOST_SUFFIX}
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    command: sh -c "npm install --legacy-peer-deps && npm start"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  dbdata:
  pipcache:
  npmcache:
