services:
  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ZERNIO_API_KEY: ${ZERNIO_API_KEY}
      ZERNIO_ACCOUNT_ID: ${ZERNIO_ACCOUNT_ID}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      DASHBOARD_TZ: ${DASHBOARD_TZ:-America/Mexico_City}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL}
    expose:
      - "80"
    depends_on:
      - backend
    restart: unless-stopped
